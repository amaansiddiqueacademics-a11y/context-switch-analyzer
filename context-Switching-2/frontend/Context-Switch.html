<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Context Switch Overhead Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  :root {
    --bg: #06090f;
    --bg2: #0a0f1a;
    --bg3: #0f1525;
    --surface: rgba(255,255,255,0.035);
    --surface2: rgba(255,255,255,0.065);
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #e8eeff;
    --text2: #7a87a0;
    --text3: #3d4a5e;
    --accent: #5d63f5;
    --accent2: #7c3aed;
    --neon: #00d4ff;
    --neon2: #00f5a0;
    --warn: #f59e0b;
    --danger: #ef4444;
    --gold: #ffd700;
    --radius: 14px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; }
  body { overflow-x: hidden; }
  #root { min-height: 100vh; }

  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  @keyframes pulse-glow { 0%,100%{box-shadow:0 0 8px rgba(93,99,245,0.4)} 50%{box-shadow:0 0 28px rgba(93,99,245,0.9),0 0 50px rgba(93,99,245,0.3)} }
  @keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
  @keyframes fadeSlideUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
  @keyframes ripple { 0%{transform:scale(0);opacity:0.8} 100%{transform:scale(6);opacity:0} }
  @keyframes count-up { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  @keyframes grid-move { 0%{transform:translateY(0)} 100%{transform:translateY(40px)} }
  @keyframes process-slide { from{width:0;opacity:0} to{opacity:1} }
  @keyframes switch-flash { 0%,100%{background:rgba(255,215,0,0.06)} 50%{background:rgba(255,215,0,0.25)} }
  @keyframes cpu-run { 0%,100%{box-shadow:0 0 12px rgba(0,212,255,0.25),inset 0 0 12px rgba(0,212,255,0.04)} 50%{box-shadow:0 0 35px rgba(0,212,255,0.7),inset 0 0 20px rgba(0,212,255,0.08)} }
  @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
  @keyframes bar-grow { from{height:0;opacity:0} to{opacity:1} }
  @keyframes orbit { 0%{transform:rotate(0deg) translateX(28px) rotate(0deg)} 100%{transform:rotate(360deg) translateX(28px) rotate(-360deg)} }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
  @keyframes ticker-slide { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
  @keyframes bg-drift { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(30px,-20px) scale(1.05)} 100%{transform:translate(0,0) scale(1)} }
  @keyframes line-scan { 0%{top:-2px} 100%{top:100%} }
  @keyframes cs-pulse { 0%,100%{opacity:0.5;transform:scaleY(1)} 50%{opacity:1;transform:scaleY(1.08)} }
  @keyframes badge-pop { 0%{transform:scale(0.8);opacity:0} 60%{transform:scale(1.12)} 100%{transform:scale(1);opacity:1} }
  @keyframes glow-border { 0%,100%{border-color:rgba(93,99,245,0.3)} 50%{border-color:rgba(93,99,245,0.7)} }
  @keyframes slide-in-right { from{transform:translateX(20px);opacity:0} to{transform:translateX(0);opacity:1} }
  @keyframes wave { 0%,100%{transform:scaleY(0.3)} 50%{transform:scaleY(1)} }

  /* ── APP SHELL ─────────────────────── */
  .app { min-height:100vh; display:flex; flex-direction:column; position:relative; overflow:hidden; }
  .app::before {
    content:''; position:fixed; inset:0;
    background-image: linear-gradient(rgba(93,99,245,0.035) 1px,transparent 1px), linear-gradient(90deg,rgba(93,99,245,0.035) 1px,transparent 1px);
    background-size:44px 44px;
    pointer-events:none; z-index:0; animation:grid-move 12s linear infinite;
  }
  .bg-orb {
    position:fixed; border-radius:50%; pointer-events:none; z-index:0; filter:blur(80px);
    animation:bg-drift 18s ease-in-out infinite;
  }
  .bg-orb-1 { width:500px; height:500px; top:-100px; left:-100px; background:radial-gradient(circle,rgba(93,99,245,0.07) 0%,transparent 70%); }
  .bg-orb-2 { width:400px; height:400px; bottom:-80px; right:-80px; background:radial-gradient(circle,rgba(124,58,237,0.06) 0%,transparent 70%); animation-delay:-9s; }
  .bg-orb-3 { width:300px; height:300px; top:50%; right:25%; background:radial-gradient(circle,rgba(0,212,255,0.04) 0%,transparent 70%); animation-delay:-4s; }

  /* ── HEADER ─────────────────────── */
  .header {
    position:relative; z-index:10;
    padding:14px 28px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--border);
    background:rgba(6,9,15,0.85);
    backdrop-filter:blur(24px);
  }
  .logo { display:flex; align-items:center; gap:14px; }
  .logo-icon {
    width:40px; height:40px;
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius:11px;
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
    box-shadow:0 4px 20px rgba(93,99,245,0.5);
    animation:pulse-glow 3s ease-in-out infinite;
    position:relative; overflow:hidden;
  }
  .logo-icon::after {
    content:''; position:absolute; inset:0;
    background:linear-gradient(135deg, rgba(255,255,255,0.25) 0%, transparent 60%);
  }
  .logo-text { font-size:16px; font-weight:800; letter-spacing:-0.5px; }
  .logo-sub { font-size:10px; color:var(--text2); font-family:'JetBrains Mono',monospace; letter-spacing:0.5px; }
  .header-right { display:flex; align-items:center; gap:10px; }

  .badge {
    padding:4px 10px;
    background:rgba(93,99,245,0.12);
    border:1px solid rgba(93,99,245,0.28);
    border-radius:20px;
    font-size:10px; color:#a5b4fc;
    font-family:'JetBrains Mono',monospace;
    letter-spacing:0.5px;
  }
  .status-badge {
    padding:4px 12px; border-radius:20px;
    font-size:10px; font-family:'JetBrains Mono',monospace;
    display:flex; align-items:center; gap:6px;
    border:1px solid transparent; transition:all 0.4s;
  }
  .status-badge .dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }

  .header-btn {
    width:34px; height:34px; border-radius:8px;
    border:1px solid var(--border2); background:var(--surface);
    color:var(--text2); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:15px; transition:all 0.2s;
  }
  .header-btn:hover { background:var(--surface2); color:var(--text); border-color:var(--accent); }

  /* Backend Status indicator */
  .backend-indicator {
    display:flex; align-items:center; gap:6px;
    padding:4px 10px;
    background:var(--surface); border:1px solid var(--border2);
    border-radius:20px; font-size:10px;
    font-family:'JetBrains Mono',monospace; color:var(--text2);
    cursor:pointer; transition:all 0.2s;
  }
  .backend-indicator:hover { border-color:var(--border2); background:var(--surface2); }
  .backend-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; transition:all 0.3s; }
  .backend-dot.connected { background:var(--neon2); box-shadow:0 0 8px var(--neon2); }
  .backend-dot.disconnected { background:var(--danger); }
  .backend-dot.checking { background:var(--warn); animation:pulse-glow 1s infinite; }

  /* ── TICKER ─────────────────────── */
  

  /* ── LAYOUT ─────────────────────── */
  .main {
    position:relative; z-index:5;
    display:grid;
    grid-template-columns:340px 1fr;
    grid-template-rows:auto 1fr;
    gap:0; flex:1;
    height:calc(100vh - 93px);
    overflow:hidden;
  }
  .left-panel {
    grid-row:1/3;
    border-right:1px solid var(--border);
    overflow-y:auto; padding:18px;
    display:flex; flex-direction:column; gap:14px;
    background:rgba(6,9,15,0.5);
  }
  .right-top {
    border-bottom:1px solid var(--border);
    padding:18px 22px; overflow:hidden;
  }
  .right-bottom {
    overflow-y:auto; padding:18px 22px;
    display:flex; flex-direction:column; gap:18px;
  }

  /* ── CARD ─────────────────────── */
  .card {
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:15px;
    backdrop-filter:blur(12px);
    animation:fadeSlideUp 0.4s ease forwards;
    position:relative; overflow:hidden;
  }
  .card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
  }
  .card-title {
    font-size:10px; font-weight:700; letter-spacing:1.5px;
    text-transform:uppercase; color:var(--text2);
    margin-bottom:13px; display:flex; align-items:center; gap:8px;
  }
  .card-title::before {
    content:''; width:3px; height:12px; border-radius:2px;
    background:linear-gradient(var(--accent), var(--accent2)); display:block;
  }

  /* ── ALGORITHM TABS ─────────────────────── */
  .algo-tabs {
    display:flex; gap:3px;
    background:rgba(0,0,0,0.35);
    padding:3px; border-radius:var(--radius-sm);
  }
  .algo-tab {
    flex:1; padding:7px 6px;
    border:none; border-radius:6px;
    background:transparent; color:var(--text2);
    font-family:'Syne',sans-serif; font-size:10px; font-weight:700;
    cursor:pointer; transition:all 0.2s; white-space:nowrap;
    position:relative; overflow:hidden;
  }
  .algo-tab.active {
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    color:white; box-shadow:0 2px 12px rgba(93,99,245,0.5);
  }
  .algo-tab.active::after {
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(255,255,255,0.15) 0%, transparent 60%);
  }
  .algo-tab:hover:not(.active) { background:var(--surface2); color:var(--text); }

  /* ── CONTROLS ─────────────────────── */
  .quantum-row { display:flex; align-items:center; gap:10px; margin-top:10px; }
  .quantum-label { font-size:11px; color:var(--text2); flex:1; }
  .quantum-val {
    font-size:16px; font-weight:700; color:var(--neon);
    font-family:'JetBrains Mono',monospace; min-width:28px; text-align:center;
  }
  .adj-btn {
    width:27px; height:27px; border-radius:6px;
    border:1px solid var(--border2); background:var(--surface);
    color:var(--text); font-size:16px; font-weight:700;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all 0.15s; line-height:1;
  }
  .adj-btn:hover { background:var(--accent); border-color:var(--accent); box-shadow:0 0 10px rgba(93,99,245,0.4); }

  /* ── PRESET BUTTONS ─────────────────────── */
  .preset-btns { display:flex; gap:6px; flex-wrap:wrap; }
  .preset-btn {
    padding:5px 12px; border-radius:20px;
    border:1px solid var(--border2); background:transparent;
    color:var(--text2); font-family:'Syne',sans-serif;
    font-size:10px; font-weight:700; cursor:pointer; transition:all 0.2s;
  }
  .preset-btn:hover { background:var(--surface2); color:var(--text); border-color:var(--accent); box-shadow:0 0 14px rgba(93,99,245,0.2); }

  /* ── PROCESS CARDS ─────────────────────── */
  .process-list { display:flex; flex-direction:column; gap:10px; }
  .process-card {
    border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:12px; background:rgba(255,255,255,0.015);
    position:relative; transition:all 0.25s;
  }
  .process-card:hover { background:rgba(255,255,255,0.03); transform:translateX(2px); }
  .process-header { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .process-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .process-name { font-size:13px; font-weight:700; flex:1; font-family:'JetBrains Mono',monospace; }
  .del-btn {
    width:22px; height:22px; border-radius:4px;
    border:1px solid var(--border); background:transparent;
    color:var(--text3); cursor:pointer; font-size:11px;
    display:flex; align-items:center; justify-content:center; transition:all 0.15s;
  }
  .del-btn:hover { background:rgba(239,68,68,0.18); border-color:rgba(239,68,68,0.5); color:var(--danger); }
  .process-fields { display:grid; grid-template-columns:1fr 1fr 1fr; gap:7px; }
  .field { display:flex; flex-direction:column; gap:3px; }
  .field label { font-size:9px; color:var(--text3); letter-spacing:0.5px; text-transform:uppercase; }
  .field input {
    width:100%; padding:5px 7px; border-radius:6px;
    border:1px solid var(--border); background:rgba(0,0,0,0.35);
    color:var(--text); font-family:'JetBrains Mono',monospace;
    font-size:12px; font-weight:600; outline:none; transition:all 0.2s;
    text-align:center;
  }
  .field input:focus { border-color:var(--accent); background:rgba(93,99,245,0.1); box-shadow:0 0 0 2px rgba(93,99,245,0.15); }
  .add-btn {
    width:100%; padding:9px; border-radius:var(--radius-sm);
    border:1px dashed var(--border2); background:transparent;
    color:var(--text2); font-family:'Syne',sans-serif;
    font-size:11px; font-weight:700; cursor:pointer; transition:all 0.2s;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .add-btn:hover { border-color:var(--accent); color:var(--accent); background:rgba(93,99,245,0.07); }

  /* ── SIM CONTROLS ─────────────────────── */
  .controls-row { display:flex; align-items:center; gap:8px; padding:12px 0; }
  .ctrl-btn {
    padding:8px 16px; border-radius:8px; border:none;
    font-family:'Syne',sans-serif; font-size:12px; font-weight:700;
    cursor:pointer; transition:all 0.2s;
    display:flex; align-items:center; gap:5px;
    position:relative; overflow:hidden;
  }
  .ctrl-btn::after {
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(255,255,255,0.12) 0%, transparent 60%);
  }
  .ctrl-play {
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    color:white; box-shadow:0 4px 18px rgba(93,99,245,0.45);
  }
  .ctrl-play:hover { transform:translateY(-1px); box-shadow:0 6px 24px rgba(93,99,245,0.6); }
  .ctrl-pause { background:rgba(245,158,11,0.13); color:var(--warn); border:1px solid rgba(245,158,11,0.28); }
  .ctrl-pause:hover { background:rgba(245,158,11,0.22); }
  .ctrl-reset { background:var(--surface); color:var(--text2); border:1px solid var(--border2); }
  .ctrl-reset:hover { background:var(--surface2); color:var(--text); }
  .ctrl-step { background:rgba(0,212,255,0.09); color:var(--neon); border:1px solid rgba(0,212,255,0.22); }
  .ctrl-step:hover { background:rgba(0,212,255,0.18); }
  .ctrl-backend {
    background:rgba(0,245,160,0.09); color:var(--neon2); border:1px solid rgba(0,245,160,0.22);
    margin-left:auto;
  }
  .ctrl-backend:hover { background:rgba(0,245,160,0.18); }
  .speed-control { display:flex; align-items:center; gap:7px; margin-left:auto; }
  .speed-label { font-size:10px; color:var(--text2); }
 .speed-slider {
  
  width: 75px;
  height: 3px;
  border-radius: 4px;
  background: var(--surface2, #ccc);
  outline: none;
  cursor: pointer;
}
  .speed-slider::-webkit-slider-thumb {
    -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
    background:linear-gradient(var(--accent), var(--accent2));
    box-shadow:0 0 10px rgba(93,99,245,0.7);
  }

  /* ── CPU VISUAL ─────────────────────── */
  .cpu-visual {
    display:flex; align-items:stretch; gap:16px; padding:14px;
    background:rgba(0,0,0,0.22); border:1px solid var(--border);
    border-radius:var(--radius); margin-bottom:14px;
  }
  .cpu-box {
    width:78px; height:78px; border:2px solid;
    border-radius:12px; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    position:relative; flex-shrink:0; transition:all 0.3s;
  }
  .cpu-box.running { border-color:var(--neon); animation:cpu-run 1.5s ease-in-out infinite; background:rgba(0,212,255,0.04); }
  .cpu-box.idle { border-color:var(--border2); background:transparent; }
  .cpu-box.switching { border-color:var(--gold); background:rgba(255,215,0,0.04); animation:switch-flash 0.5s ease-in-out infinite; }
  .cpu-scanner {
    position:absolute; left:0; right:0; height:1px;
    background:linear-gradient(90deg, transparent, rgba(0,212,255,0.6), transparent);
    animation:line-scan 2s linear infinite;
  }
  .cpu-scanner.switching { background:linear-gradient(90deg, transparent, rgba(255,215,0,0.6), transparent); }
  .cpu-label { font-size:9px; color:var(--text2); letter-spacing:1.5px; text-transform:uppercase; font-family:'JetBrains Mono',monospace; }
  .cpu-process { font-size:17px; font-weight:800; font-family:'JetBrains Mono',monospace; margin:2px 0; transition:all 0.3s; }
  .cpu-time { font-size:9px; font-family:'JetBrains Mono',monospace; color:var(--neon); }
  .process-queue { flex:1; display:flex; flex-direction:column; gap:5px; }
  .queue-title { font-size:9px; color:var(--text3); letter-spacing:1.5px; text-transform:uppercase; margin-bottom:3px; }
  .queue-row { display:flex; gap:5px; flex-wrap:wrap; }
  .queue-item {
    padding:3px 9px; border-radius:5px;
    font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700;
    border:1px solid; transition:all 0.3s;
  }
  .queue-item.running { opacity:1; animation:cs-pulse 0.8s ease-in-out infinite; }
  .queue-item.waiting { opacity:0.45; }
  .queue-item.done { opacity:0.18; text-decoration:line-through; }

  /* ── GANTT ─────────────────────── */
  .gantt-wrapper { position:relative; overflow:hidden; }
  .gantt-title-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .gantt-canvas {
    position:relative; height:76px;
    border-radius:var(--radius-sm); background:rgba(0,0,0,0.22);
    border:1px solid var(--border); overflow:hidden; display:flex;
  }
  .gantt-block {
    height:100%; position:relative;
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700;
    color:white; transition:opacity 0.3s; flex-shrink:0; overflow:hidden; cursor:pointer;
  }
  .gantt-block::after {
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(255,255,255,0.14) 0%, transparent 55%);
  }
  .gantt-block.context-switch {
    background:repeating-linear-gradient(45deg, rgba(255,215,0,0.14), rgba(255,215,0,0.14) 3px, rgba(255,215,0,0.04) 3px, rgba(255,215,0,0.04) 8px);
    border-left:1px solid rgba(255,215,0,0.45); border-right:1px solid rgba(255,215,0,0.45);
    animation:switch-flash 0.9s ease-in-out;
  }
  .gantt-block.active-process { z-index:2; text-shadow:0 1px 4px rgba(0,0,0,0.5); font-size:11px; }
  .gantt-label { position:relative; z-index:2; text-shadow:0 1px 4px rgba(0,0,0,0.5); font-size:11px; }
  .gantt-time-row { display:flex; position:relative; height:18px; margin-top:3px; }
  .gantt-tick { position:absolute; font-family:'JetBrains Mono',monospace; font-size:8px; color:var(--text3); transform:translateX(-50%); }
  .cursor-line {
    position:absolute; top:0; bottom:0; width:2px;
    background:rgba(255,255,255,0.85);
    box-shadow:0 0 10px rgba(255,255,255,0.5);
    z-index:10; transition:left 0.1s linear; pointer-events:none;
  }
  .cursor-line::before {
    content:''; position:absolute; top:-4px; left:-4px;
    width:10px; height:10px; border-radius:50%;
    background:white; box-shadow:0 0 10px white;
  }

  /* ── METRICS ─────────────────────── */
  .metrics-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .metric-card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:11px 13px;
    position:relative; overflow:hidden; transition:all 0.3s;
  }
  .metric-card:hover { transform:translateY(-1px); border-color:var(--border2); }
  .metric-card::before {
    content:''; position:absolute; bottom:0; left:0; right:0; height:2px; border-radius:1px;
  }
  .metric-card::after {
    content:''; position:absolute; top:0; right:0; width:60px; height:60px;
    border-radius:50%; opacity:0.06; transform:translate(20px,-20px);
  }
  .metric-card.cyan::before { background:var(--neon); }

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ─── CONSTANTS ─────────────────────────── */
const COLORS = [
  { bg:'#5d63f5', glow:'rgba(93,99,245,0.55)', light:'#a5b4fc' },
  { bg:'#10b981', glow:'rgba(16,185,129,0.55)', light:'#6ee7b7' },
  { bg:'#f59e0b', glow:'rgba(245,158,11,0.55)', light:'#fcd34d' },
  { bg:'#ef4444', glow:'rgba(239,68,68,0.55)', light:'#fca5a5' },
  { bg:'#8b5cf6', glow:'rgba(139,92,246,0.55)', light:'#c4b5fd' },
  { bg:'#06b6d4', glow:'rgba(6,182,212,0.55)', light:'#67e8f9' },
];

const CS_OVERHEAD_MS = 2;

const PRESETS = {
  'Low Load': [
    { id:1,name:'P1',arrival:0,burst:5,priority:1 },
    { id:2,name:'P2',arrival:2,burst:3,priority:2 },
    { id:3,name:'P3',arrival:4,burst:2,priority:3 },
  ],
  'High Load': [
    { id:1,name:'P1',arrival:0,burst:8,priority:2 },
    { id:2,name:'P2',arrival:1,burst:4,priority:1 },
    { id:3,name:'P3',arrival:2,burst:6,priority:3 },
    { id:4,name:'P4',arrival:3,burst:2,priority:1 },
    { id:5,name:'P5',arrival:5,burst:5,priority:2 },
  ],
  'Burst Storm': [
    { id:1,name:'P1',arrival:0,burst:10,priority:3 },
    { id:2,name:'P2',arrival:0,burst:1,priority:1 },
    { id:3,name:'P3',arrival:0,burst:3,priority:2 },
    { id:4,name:'P4',arrival:1,burst:2,priority:1 },
  ],
};

/* ─── SCHEDULING ALGORITHMS ─────────────────────────── */
function runFCFS(processes) {
  const procs = [...processes].sort((a,b) => a.arrival - b.arrival);
  const timeline = []; let time = 0;
  for (const p of procs) {
    if (time < p.arrival) time = p.arrival;
    timeline.push({ pid:p.id,name:p.name,start:time,end:time+p.burst,color:p.color });
    time += p.burst;
  }
  return buildResult(timeline, processes);
}

function runSJF(processes) {
  const procs = processes.map(p => ({ ...p,remaining:p.burst }));
  const timeline = []; let time = 0; const done = new Set();
  while (done.size < procs.length) {
    const available = procs.filter(p => p.arrival <= time && !done.has(p.id));
    if (!available.length) { time++; continue; }
    const shortest = available.sort((a,b) => a.burst - b.burst)[0];
    timeline.push({ pid:shortest.id,name:shortest.name,start:time,end:time+shortest.burst,color:shortest.color });
    time += shortest.burst;
    done.add(shortest.id);
  }
  return buildResult(timeline, processes);
}

function runRR(processes, quantum) {
  const procs = processes.map(p => ({ ...p,remaining:p.burst }));
  const timeline = []; let time = 0;
  const queue = []; const inQueue = new Set();
  const sorted = [...procs].sort((a,b) => a.arrival - b.arrival);
  let idx = 0;
  while (idx < sorted.length && sorted[idx].arrival <= time) {
    queue.push(sorted[idx]); inQueue.add(sorted[idx].id); idx++;
  }
  while (queue.length > 0) {
    const current = queue.shift();
    const runTime = Math.min(quantum, current.remaining);
    const start = time; time += runTime; current.remaining -= runTime;
    timeline.push({ pid:current.id,name:current.name,start,end:time,color:current.color });
    while (idx < sorted.length && sorted[idx].arrival <= time) {
      if (!inQueue.has(sorted[idx].id)) { queue.push(sorted[idx]); inQueue.add(sorted[idx].id); }
      idx++;
    }
    if (current.remaining > 0) queue.push(current);
    else inQueue.delete(current.id);
    if (queue.length === 0 && idx < sorted.length) {
      time = sorted[idx].arrival;
      while (idx < sorted.length && sorted[idx].arrival <= time) {
        queue.push(sorted[idx]); inQueue.add(sorted[idx].id); idx++;
      }
    }
  }
  return buildResult(timeline, processes);
}

function buildResult(rawTimeline, processes) {
  const timeline = [];
  for (let i = 0; i < rawTimeline.length; i++) {
    if (i > 0 && rawTimeline[i].pid !== rawTimeline[i-1].pid) {
      timeline.push({ isSwitch:true, start:rawTimeline[i-1].end, end:rawTimeline[i-1].end + 0.3 });
    }
    timeline.push(rawTimeline[i]);
  }
  const totalTime = rawTimeline[rawTimeline.length-1]?.end || 1;
  let contextSwitches = 0;
  for (let i = 1; i < rawTimeline.length; i++) {
    if (rawTimeline[i].pid !== rawTimeline[i-1].pid) contextSwitches++;
  }
  const processMetrics = processes.map(p => {
    const segments = rawTimeline.filter(t => t.pid === p.id);
    if (!segments.length) return null;
    const completion = Math.max(...segments.map(s => s.end));
    const turnaround = completion - p.arrival;
    const waiting = turnaround - p.burst;
    return { ...p, completion, turnaround, waiting:Math.max(0,waiting) };
  }).filter(Boolean);
  const avgWaiting = processMetrics.reduce((s,p) => s+p.waiting, 0) / processMetrics.length;
  const avgTurnaround = processMetrics.reduce((s,p) => s+p.turnaround, 0) / processMetrics.length;
  const busyTime = rawTimeline.reduce((s,t) => s+(t.end-t.start), 0);
  const cpuUtil = Math.min(100, (busyTime/totalTime)*100);
  const csOverhead = contextSwitches * CS_OVERHEAD_MS;
  const perfLoss = Math.min(100, (csOverhead/(totalTime*10+csOverhead))*100);
  return { timeline, rawTimeline, totalTime, contextSwitches, csOverhead, perfLoss, avgWaiting, avgTurnaround, cpuUtil, processMetrics };
}

/* ─── BACKEND API ─────────────────────────── */
const API_BASE = 'http://localhost:8000';

async function fetchBackendSimulation(processes, algorithm, quantum, csOverheadMs) {
  const resp = await fetch(`${API_BASE}/simulate`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({
      processes: processes.map(p => ({ id:p.id, name:p.name, arrival_time:p.arrival, burst_time:p.burst, priority:p.priority })),
      algorithm,
      quantum: algorithm==='RR' ? quantum : undefined,
      cs_overhead_ms: csOverheadMs,
    }),
  });
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.json();
}

async function checkBackendHealth() {
  try {
    const resp = await fetch(`${API_BASE}/health`, { signal: AbortSignal.timeout(2000) });
    return resp.ok;
  } catch { return false; }
}

/* ─── HELPER ─────────────────────────── */
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

/* ─── SPARKLINE ─────────────────────────── */
function Sparkline({ data, color, width=100, height=30 }) {
  if (!data || data.length < 2) return null;
  const max = Math.max(...data); const min = Math.min(...data);
  const range = max - min || 1;
  const pts = data.map((v,i) => {
    const x = (i/(data.length-1)) * width;
    const y = height - ((v-min)/range) * height;
    return `${x},${y}`;
  }).join(' ');
  const area = `M0,${height} L${pts.split(' ').map(p => p).join(' L')} L${width},${height} Z`;
  return (
    <svg width={width} height={height} className="sparkline-svg">
      <defs>
        <linearGradient id={`sg_${color.replace('#','')}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.35"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <path d={`M0,${height} L${pts.split(' ').join(' L')} L${width},${height} Z`} fill={`url(#sg_${color.replace('#','')})`}/>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round"/>
    </svg>
  );
}

/* ─── METRIC CARD ─────────────────────────── */
function MetricCard({ color, label, value, unit, history }) {
  const [display, setDisplay] = useState(0);
  useEffect(() => {
    const target = parseFloat(value);
    const diff = target - display;
    if (Math.abs(diff) < 0.01) { setDisplay(target); return; }
    const steps = 20; let step = 0;
    const interval = setInterval(() => {
      step++;
      setDisplay(prev => {
        const next = prev + diff/steps;
        if (step >= steps) { clearInterval(interval); return target; }
        return next;
      });
    }, 20);
    return () => clearInterval(interval);
  }, [value]);

  const colorMap = { cyan:'#00d4ff', green:'#00f5a0', purple:'#5d63f5', amber:'#f59e0b', red:'#ef4444', blue:'#60a5fa' };

  return (
    <div className={`metric-card ${color}`}>
      <div className="metric-label">{label}</div>
      <div className="metric-value">
        {parseFloat(value)%1===0 ? Math.round(display) : display.toFixed(2)}
        {unit && <span className="metric-unit">{unit}</span>}
      </div>
      {history && history.length > 1 && (
        <div style={{position:'absolute', bottom:14, right:10, opacity:0.5}}>
          <Sparkline data={history} color={colorMap[color]||'#fff'} width={50} height={18}/>
        </div>
      )}
    </div>
  );
}

/* ─── TICKER ─────────────────────────── */


/* ─── MAIN APP ─────────────────────────── */
function App() {
  const [light, setLight] = useState(false);
  const [algo, setAlgo] = useState('FCFS');
  const [quantum, setQuantum] = useState(2);
  const [csOverheadMs, setCsOverheadMs] = useState(CS_OVERHEAD_MS);
  const [processes, setProcesses] = useState([
    { id:1,name:'P1',arrival:0,burst:6,priority:2 },
    { id:2,name:'P2',arrival:2,burst:4,priority:1 },
    { id:3,name:'P3',arrival:4,burst:3,priority:3 },
    { id:4,name:'P4',arrival:6,burst:5,priority:2 },
  ]);
  const [result, setResult] = useState(null);
  const [simTime, setSimTime] = useState(0);
  const [simState, setSimState] = useState('idle');
  const [speed, setSpeed] = useState(2);
  const [showCompare, setShowCompare] = useState(false);
  const [tooltip, setTooltip] = useState(null);
  const [compareResults, setCompareResults] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [backendStatus, setBackendStatus] = useState('checking');
  const [backendResult, setBackendResult] = useState(null);
  const [backendLoading, setBackendLoading] = useState(false);
  const [backendError, setBackendError] = useState(null);
  const [metricHistory, setMetricHistory] = useState({ wait:[], tat:[], util:[] });
  const animRef = useRef(null);
  const lastTimeRef = useRef(null);

  useEffect(() => { setTimeout(() => setLoaded(true), 550); }, []);

  // Poll backend health every 5s
  useEffect(() => {
    const check = async () => {
      const ok = await checkBackendHealth();
      setBackendStatus(ok ? 'connected' : 'disconnected');
    };
    check();
    const id = setInterval(check, 5000);
    return () => clearInterval(id);
  }, []);

  const coloredProcesses = processes.map((p,i) => ({ ...p, color:COLORS[i%COLORS.length] }));

  useEffect(() => {
    if (coloredProcesses.length === 0) { setResult(null); return; }
    let r;
    if (algo === 'FCFS') r = runFCFS(coloredProcesses);
    else if (algo === 'SJF') r = runSJF(coloredProcesses);
    else r = runRR(coloredProcesses, quantum);
    setResult(r);
    setMetricHistory(h => ({
      wait: [...h.wait.slice(-14), r.avgWaiting],
      tat:  [...h.tat.slice(-14), r.avgTurnaround],
      util: [...h.util.slice(-14), r.cpuUtil],
    }));
    if (simState === 'done') setSimState('idle');
  }, [processes, algo, quantum]);

  // Simulation engine
  const startSim = () => { setSimTime(0); setSimState('running'); lastTimeRef.current = null; };
  const pauseSim = () => setSimState(s => s==='running' ? 'paused' : 'running');
  const resetSim = () => { setSimState('idle'); setSimTime(0); if (animRef.current) cancelAnimationFrame(animRef.current); };
  const stepSim = () => {
    if (!result) return;
    setSimTime(t => {
      const next = Math.min(t + 0.5, result.totalTime);
      if (next >= result.totalTime) setSimState('done');
      return next;
    });
  };

  useEffect(() => {
    if (simState !== 'running' || !result) return;
    const tick = (ts) => {
      if (lastTimeRef.current == null) lastTimeRef.current = ts;
      const delta = (ts - lastTimeRef.current)/1000;
      lastTimeRef.current = ts;
      setSimTime(t => {
        const next = t + delta*speed*1.5;
        if (next >= result.totalTime) { setSimState('done'); return result.totalTime; }
        return next;
      });
      animRef.current = requestAnimationFrame(tick);
    };
    animRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(animRef.current);
  }, [simState, speed, result]);

  const currentProcess = result ? result.rawTimeline.find(t => t.start <= simTime && t.end > simTime) : null;
  const isContextSwitch = result ? result.timeline.find(t => t.isSwitch && t.start <= simTime && t.end > simTime) : false;

  const addProcess = () => {
    const id = Math.max(0, ...processes.map(p => p.id)) + 1;
    setProcesses(prev => [...prev, { id, name:`P${id}`, arrival:0, burst:4, priority:1 }]);
  };
  const removeProcess = (id) => setProcesses(prev => prev.filter(p => p.id !== id));
  const updateProcess = (id, field, val) => {
    setProcesses(prev => prev.map(p => p.id === id ? { ...p, [field]:Math.max(0, parseInt(val)||0) } : p));
  };
  const loadPreset = (name) => { setProcesses(PRESETS[name]); resetSim(); setBackendResult(null); };

  const runCompare = () => {
    const r = {
      FCFS: buildResult(runFCFS(coloredProcesses).rawTimeline, coloredProcesses),
      SJF:  buildResult(runSJF(coloredProcesses).rawTimeline,  coloredProcesses),
      RR:   buildResult(runRR(coloredProcesses,quantum).rawTimeline, coloredProcesses),
    };
    setCompareResults(r); setShowCompare(true);
  };

  // Run via backend
  const runWithBackend = async () => {
    if (backendStatus !== 'connected') {
      setBackendError('Backend not reachable. Start uvicorn on port 8000.');
      return;
    }
    setBackendLoading(true); setBackendError(null); setBackendResult(null);
    try {
      const data = await fetchBackendSimulation(coloredProcesses, algo, quantum, csOverheadMs);
      setBackendResult(data);
    } catch(e) {
      setBackendError(e.message || 'Backend request failed');
    } finally {
      setBackendLoading(false);
    }
  };

  // Export CSV
  const exportCSV = () => {
    if (!result) return;
    const rows = [
      ['Process','Arrival','Burst','Completion','Waiting','Turnaround','Efficiency%'],
      ...result.processMetrics.map(p => [
        p.name, p.arrival, p.burst, p.completion, p.waiting, p.turnaround,
        ((p.burst/p.turnaround)*100).toFixed(1)
      ])
    ];
    const csv = rows.map(r => r.join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=`scheduler_${algo}_${Date.now()}.csv`; a.click();
    URL.revokeObjectURL(url);
  };

  const ganttWidth = result ? result.totalTime : 1;

  /* ─ STATUS BADGE ─ */
  const statusConfig = {
    idle:    { color:'var(--text2)',  dotBg:'var(--text3)',  text:'● READY',    border:'transparent' },
    running: { color:'var(--neon2)', dotBg:'var(--neon2)',  text:'▶ RUNNING',  border:'rgba(0,245,160,0.25)' },
    paused:  { color:'var(--warn)',  dotBg:'var(--warn)',   text:'⏸ PAUSED',   border:'rgba(245,158,11,0.25)' },
    done:    { color:'#a5b4fc',      dotBg:'var(--accent)', text:'✓ COMPLETE', border:'rgba(93,99,245,0.25)' },
  };
  const sc = statusConfig[simState] || statusConfig.idle;

  return (
    <div className={`app ${light ? 'light' : ''}`}>
      <div className="bg-orb bg-orb-1"></div>
      <div className="bg-orb bg-orb-2"></div>
      <div className="bg-orb bg-orb-3"></div>

      {!loaded && (
        <div className="loading-screen">
          <div className="loading-ring"></div>
          <div className="loading-text">Initializing Scheduler</div>
        </div>
      )}

      {/* ── HEADER ── */}
      <div className="header">
        <div className="logo">
          <div className="logo-icon">⚡</div>
          <div>
            <div className="logo-text">Context Switch Analyzer</div>
            <div className="logo-sub">CPU PROCESS SCHEDULING SIMULATOR</div>
          </div>
        </div>
        <div className="header-right">
          <div className="badge">v3.0</div>
          <div className="status-badge" style={{color:sc.color, borderColor:sc.border, background:sc.border}}>
            <div className="dot" style={{background:sc.dotBg, boxShadow:simState==='running'?`0 0 8px ${sc.dotBg}`:'none'}}></div>
            {sc.text}
          </div>
          <div className="backend-indicator" title={`Backend: ${backendStatus}`}>
            <div className={`backend-dot ${backendStatus}`}></div>
            <span>BACKEND</span>
            <span style={{color:backendStatus==='connected'?'var(--neon2)':backendStatus==='checking'?'var(--warn)':'var(--danger)'}}>
              {backendStatus==='connected'?'LIVE':backendStatus==='checking'?'…':'OFF'}
            </span>
          </div>
          <button className="header-btn" onClick={() => setLight(l => !l)} title="Toggle theme">
            {light ? '🌙' : '☀️'}
          </button>
        </div>
      </div>

      {/* ── TICKER ── */}
      

      {/* ── MAIN ── */}
      <div className="main">

        {/* ── LEFT PANEL ── */}
        <div className="left-panel">

          {/* Algorithm */}
          <div className="card">
            <div className="card-title">Algorithm</div>
            <div className="algo-tabs">
              {['FCFS','SJF','Round Robin'].map(a => (
                <button key={a} className={`algo-tab ${algo===(a==='Round Robin'?'RR':a)?'active':''}`}
                  onClick={() => setAlgo(a==='Round Robin'?'RR':a)}>{a}</button>
              ))}
            </div>
            {algo === 'RR' && (
              <div className="quantum-row">
                <span className="quantum-label">Time Quantum</span>
                <button className="adj-btn" onClick={() => setQuantum(q => Math.max(1,q-1))}>−</button>
                <span className="quantum-val">{quantum}</span>
                <button className="adj-btn" onClick={() => setQuantum(q => q+1)}>+</button>
              </div>
            )}
            <div className="quantum-row">
              <span className="quantum-label" style={{fontSize:10}}>CS Overhead (ms)</span>
              <button className="adj-btn" onClick={() => setCsOverheadMs(v => Math.max(0,v-1))}>−</button>
              <span className="quantum-val" style={{color:'var(--gold)'}}>{csOverheadMs}</span>
              <button className="adj-btn" onClick={() => setCsOverheadMs(v => v+1)}>+</button>
            </div>
          </div>

          {/* Presets */}
          <div className="card">
            <div className="card-title">Presets</div>
            <div className="preset-btns">
              {Object.keys(PRESETS).map(name => (
                <button key={name} className="preset-btn" onClick={() => loadPreset(name)}>{name}</button>
              ))}
            </div>
          </div>

          {/* Processes */}
          <div className="card" style={{flex:1}}>
            <div className="card-title">Processes ({processes.length})</div>
            <div className="process-list">
              {coloredProcesses.map(p => (
                <div key={p.id} className="process-card" style={{borderColor:`rgba(${hexToRgb(p.color.bg)},0.28)`}}>
                  <div className="process-header">
                    <div className="process-dot" style={{background:p.color.bg, boxShadow:`0 0 7px ${p.color.bg}`}}></div>
                    <span className="process-name" style={{color:p.color.light}}>{p.name}</span>
                    <button className="del-btn" onClick={() => removeProcess(p.id)}>✕</button>
                  </div>
                  <div className="process-fields">
                    <div className="field"><label>Arrival</label>
                      <input type="number" min="0" value={p.arrival} onChange={e => updateProcess(p.id,'arrival',e.target.value)}/>
                    </div>
                    <div className="field"><label>Burst</label>
                      <input type="number" min="1" value={p.burst} onChange={e => updateProcess(p.id,'burst',e.target.value)}/>
                    </div>
                    <div className="field"><label>Priority</label>
                      <input type="number" min="1" value={p.priority} onChange={e => updateProcess(p.id,'priority',e.target.value)}/>
                    </div>
                  </div>
                </div>
              ))}
              {processes.length < 6 && (
                <button className="add-btn" onClick={addProcess}>＋ Add Process</button>
              )}
            </div>
          </div>

          {/* Action Buttons */}
          <button className="add-btn" style={{borderStyle:'solid',borderColor:'rgba(93,99,245,0.35)',color:'#a5b4fc'}}
            onClick={runCompare}>⊞ Compare Algorithms</button>
          <button className="add-btn" style={{borderStyle:'solid',borderColor:'rgba(0,245,160,0.3)',color:'var(--neon2)'}}
            onClick={exportCSV} disabled={!result}>⬇ Export CSV</button>
        </div>

        {/* ── RIGHT TOP ── */}
        <div className="right-top">
          {/* Controls */}
          <div className="controls-row" style={{paddingTop:0}}>
            {simState !== 'running' && simState !== 'paused' ? (
              <button className="ctrl-btn ctrl-play" onClick={startSim}>▶ Run Simulation</button>
            ) : (
              <button className="ctrl-btn ctrl-pause" onClick={pauseSim}>
                {simState==='running'?'⏸ Pause':'▶ Resume'}
              </button>
            )}
            <button className="ctrl-btn ctrl-step" onClick={stepSim}>⏭ Step</button>
            <button className="ctrl-btn ctrl-reset" onClick={resetSim}>↺ Reset</button>
            <button className="ctrl-btn ctrl-backend" onClick={runWithBackend}
              disabled={backendStatus!=='connected'||backendLoading}
              style={{opacity:backendStatus!=='connected'?0.45:1}}>
              {backendLoading ? '⟳ Fetching…' : `⚡ Run via API`}
            </button>
            <div className="speed-control">
              <span className="speed-label">Speed</span>
              <input type="range" className="speed-slider" min="0.5" max="5" step="0.5" value={speed}
                onChange={e => setSpeed(Number(e.target.value))}/>
              <span style={{fontSize:10,fontFamily:'JetBrains Mono',color:'var(--neon)'}}>{speed}x</span>
            </div>
          </div>

          {/* CPU State */}
          {result && (
            <div className="cpu-visual">
              <div className={`cpu-box ${isContextSwitch?'switching':currentProcess?'running':'idle'}`}>
                {(currentProcess || isContextSwitch) && <div className={`cpu-scanner ${isContextSwitch?'switching':''}`}></div>}
                <div className="cpu-label">CPU</div>
                <div className="cpu-process" style={{color:isContextSwitch?'var(--gold)':currentProcess?currentProcess.color.light:'var(--text3)'}}>
                  {isContextSwitch ? 'CS' : currentProcess ? currentProcess.name : '—'}
                </div>
                <div className="cpu-time">{simTime.toFixed(1)}ms</div>
              </div>
              <div className="process-queue">
                <div className="queue-title">Process Queue</div>
                <div className="queue-row">
                  {coloredProcesses.map(p => {
                    const done = (result.processMetrics.find(m => m.id===p.id)?.completion||Infinity) <= simTime;
                    const state = currentProcess?.pid===p.id ? 'running' : done ? 'done' : 'waiting';
                    return (
                      <div key={p.id} className={`queue-item ${state}`}
                        style={{background:state==='running'?`rgba(${hexToRgb(p.color.bg)},0.3)`:`rgba(${hexToRgb(p.color.bg)},0.08)`,
                          borderColor:p.color.bg, color:p.color.light}}>
                        {p.name}
                      </div>
                    );
                  })}
                </div>
                <div style={{display:'flex',gap:12,marginTop:4}}>
                  <span style={{fontSize:9,color:'var(--text3)'}}>
                    Switches: <span style={{color:'var(--gold)',fontFamily:'JetBrains Mono'}}>
                      {result.rawTimeline.filter((t,i) => i>0 && t.pid!==result.rawTimeline[i-1].pid && t.start<=simTime).length}
                    </span>
                  </span>
                  <span style={{fontSize:9,color:'var(--text3)'}}>
                    Progress: <span style={{color:'var(--neon2)',fontFamily:'JetBrains Mono'}}>
                      {result.totalTime>0?Math.min(100,(simTime/result.totalTime*100)).toFixed(0):0}%
                    </span>
                  </span>
                </div>
              </div>
              <div style={{flex:1,display:'flex',flexDirection:'column',gap:6}}>
                <div style={{fontSize:9,color:'var(--text3)',marginBottom:2}}>Timeline Progress</div>
                <div className="efficiency-bar-wrap" style={{height:10}}>
                  <div className="efficiency-bar" style={{
                    width:`${result.totalTime>0?Math.min(100,simTime/result.totalTime*100):0}%`,
                    background:isContextSwitch
                      ?'linear-gradient(90deg,var(--gold),#ff8c00)'
                      :'linear-gradient(90deg,var(--accent),var(--neon))'
                  }}></div>
                </div>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:9,color:'var(--text3)',fontFamily:'JetBrains Mono'}}>
                  <span>0</span><span>{result.totalTime}ms</span>
                </div>
                {/* Wave bars when running */}
                {simState==='running' && !isContextSwitch && (
                  <div style={{marginTop:4}}>
                    <div className="wave-bars">
                      {[14,18,12,20,16].map((h,i) => (
                        <div key={i} className="wave-bar" style={{height:h}}></div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* GANTT */}
          {result && (
            <div className="gantt-wrapper">
              <div className="gantt-title-row">
                <div className="section-header">
                  <div className="section-dot"></div>
                  Gantt Chart — {algo==='RR'?`Round Robin (q=${quantum})`:algo}
                </div>
                <div style={{display:'flex',gap:10,alignItems:'center'}}>
                  {coloredProcesses.map(p => (
                    <div key={p.id} style={{display:'flex',alignItems:'center',gap:4}}>
                      <div style={{width:7,height:7,borderRadius:2,background:p.color.bg,boxShadow:`0 0 5px ${p.color.bg}`}}></div>
                      <span style={{fontSize:9,color:'var(--text2)',fontFamily:'JetBrains Mono'}}>{p.name}</span>
                    </div>
                  ))}
                  <div style={{display:'flex',alignItems:'center',gap:4}}>
                    <div style={{width:7,height:7,borderRadius:2,background:'rgba(255,215,0,0.5)'}}></div>
                    <span style={{fontSize:9,color:'var(--text2)',fontFamily:'JetBrains Mono'}}>CS</span>
                  </div>
                </div>
              </div>
              <div className="gantt-canvas">
                {result.timeline.map((block,i) => {
                  const w = ((block.end-block.start)/ganttWidth)*100;
                  const isActive = !block.isSwitch && currentProcess?.pid===block.pid && block.start<=simTime && block.end>simTime;
                  const isVisible = block.end <= simTime+0.01 || block.start < simTime;
                  const partialW = block.start>=simTime ? 0 : Math.min(1,(simTime-block.start)/(block.end-block.start))*100;
                  return (
                    <div key={i}
                      className={`gantt-block ${block.isSwitch?'context-switch':''} ${isActive?'active-process':''}`}
                      style={{
                        width:`${w}%`,
                        background:block.isSwitch ? undefined : block.color?.bg,
                        opacity:(simState==='idle'||simState==='done') ? 1 : (isVisible||isActive ? 1 : 0.12),
                        boxShadow:isActive ? `0 0 22px ${block.color?.glow}` : 'none',
                        transition:'opacity 0.3s, box-shadow 0.3s',
                      }}
                      onMouseEnter={e => {
                        if (!block.isSwitch) setTooltip({ x:e.clientX, y:e.clientY, block });
                      }}
                      onMouseLeave={() => setTooltip(null)}
                    >
                      {!block.isSwitch && (
                        <>
                          {isActive && (
                            <div style={{
                              position:'absolute',left:0,top:0,bottom:0,
                              width:`${partialW}%`,
                              background:'rgba(255,255,255,0.18)',
                              transition:'width 0.1s linear',
                            }}></div>
                          )}
                          <span className="gantt-label">{w>4?block.name:''}</span>
                        </>
                      )}
                    </div>
                  );
                })}
                {(simState==='running'||simState==='paused') && result && (
                  <div className="cursor-line" style={{left:`${(simTime/result.totalTime)*100}%`}}></div>
                )}
              </div>
              <div className="gantt-time-row">
                {Array.from({length:Math.min(result.totalTime+1,21)},(_,i) => {
                  const t = Math.round(i*result.totalTime/Math.min(result.totalTime,20));
                  return <div key={t} className="gantt-tick" style={{left:`${(t/result.totalTime)*100}%`}}>{t}</div>;
                })}
              </div>
            </div>
          )}
        </div>

        {/* ── RIGHT BOTTOM ── */}
        <div className="right-bottom">
          {result ? (
            <>
              {/* Metrics */}
              <div>
                <div className="section-header" style={{justifyContent:'space-between'}}>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <div className="section-dot"></div>Performance Metrics
                  </div>
                  <button className="export-btn" onClick={exportCSV}>⬇ CSV</button>
                </div>
                <div className="metrics-grid">
                  <MetricCard color="cyan"   label="Avg Waiting"     value={result.avgWaiting.toFixed(2)} unit="ms" history={metricHistory.wait}/>
                  <MetricCard color="green"  label="Avg Turnaround"  value={result.avgTurnaround.toFixed(2)} unit="ms" history={metricHistory.tat}/>
                  <MetricCard color="purple" label="CPU Utilization" value={result.cpuUtil.toFixed(1)} unit="%" history={metricHistory.util}/>
                  <MetricCard color="amber"  label="Context Switches" value={result.contextSwitches} unit=""/>
                  <MetricCard color="red"    label="CS Overhead"     value={(result.contextSwitches*csOverheadMs).toFixed(1)} unit="ms"/>
                  <MetricCard color="blue"   label="Perf Loss"       value={Math.min(100,(result.contextSwitches*csOverheadMs)/(result.totalTime*10+result.contextSwitches*csOverheadMs)*100).toFixed(1)} unit="%"/>
                </div>
              </div>

              {/* Backend Result Panel */}
              {(backendLoading || backendResult || backendError) && (
                <div>
                  <div className="section-header"><div className="section-dot" style={{background:'var(--neon2)'}}></div>Backend API Result</div>
                  <div className="backend-panel">
                    <div className="backend-panel-title">⚡ FastAPI Server Response</div>
                    {backendLoading && (
                      <div className="backend-loading">
                        <div className="mini-spinner"></div>
                        Fetching from uvicorn backend…
                      </div>
                    )}
                    {backendError && (
                      <div style={{fontSize:11,color:'var(--danger)',fontFamily:'JetBrains Mono',padding:'6px 0'}}>
                        ✗ {backendError}
                        <div style={{marginTop:4,fontSize:9,color:'var(--text3)'}}>
                          Start with: uvicorn backend:app --reload --port 8000
                        </div>
                      </div>
                    )}
                    {backendResult && (
                      <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:8}}>
                        {Object.entries(backendResult.metrics||{}).map(([k,v]) => (
                          <div key={k} style={{background:'rgba(0,245,160,0.06)',borderRadius:6,padding:'7px 10px',border:'1px solid rgba(0,245,160,0.12)'}}>
                            <div style={{fontSize:9,color:'var(--neon2)',letterSpacing:1,textTransform:'uppercase',marginBottom:3}}>{k.replace(/_/g,' ')}</div>
                            <div style={{fontSize:14,fontWeight:800,fontFamily:'JetBrains Mono',color:'var(--text)'}}>{typeof v==='number'?v.toFixed(2):v}</div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* Per-process table */}
              <div>
                <div className="section-header"><div className="section-dot"></div>Per-Process Analysis</div>
                <div className="card" style={{padding:0}}>
                  <table className="process-table">
                    <thead>
                      <tr>
                        <th>Process</th><th>Arrival</th><th>Burst</th>
                        <th>Finish</th><th>Waiting</th><th>Turnaround</th><th>Efficiency</th>
                      </tr>
                    </thead>
                    <tbody>
                      {result.processMetrics.map(p => {
                        const eff = (p.burst/p.turnaround)*100;
                        const cp = coloredProcesses.find(c => c.id===p.id);
                        return (
                          <tr key={p.id}>
                            <td>
                              <div className="pid-cell">
                                <div style={{width:7,height:7,borderRadius:2,background:cp?.color.bg,flexShrink:0,boxShadow:`0 0 5px ${cp?.color.bg}`}}></div>
                                <span style={{color:cp?.color.light,fontWeight:700}}>{p.name}</span>
                              </div>
                            </td>
                            <td style={{color:'var(--text2)'}}>{p.arrival}</td>
                            <td style={{color:'var(--text2)'}}>{p.burst}</td>
                            <td style={{color:'var(--neon)'}}>{p.completion}</td>
                            <td style={{color:p.waiting>5?'var(--danger)':'var(--text)'}}>{p.waiting}</td>
                            <td style={{color:'var(--text)'}}>{p.turnaround}</td>
                            <td>
                              <div style={{display:'flex',alignItems:'center',gap:6}}>
                                <div className="efficiency-bar-wrap">
                                  <div className="efficiency-bar" style={{
                                    width:`${Math.min(100,eff)}%`,
                                    background:eff>70?'linear-gradient(90deg,var(--neon2),#34d399)':
                                      eff>40?'linear-gradient(90deg,var(--warn),#fbbf24)':'linear-gradient(90deg,var(--danger),#f87171)',
                                  }}></div>
                                </div>
                                <span style={{fontSize:9,fontFamily:'JetBrains Mono',color:'var(--text2)',minWidth:28}}>{eff.toFixed(0)}%</span>
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>

              {/* Bar Chart */}
              <div>
                <div className="section-header"><div className="section-dot"></div>Waiting Time Distribution</div>
                <div className="card">
                  <div className="bar-chart">
                    {result.processMetrics.map(p => {
                      const cp = coloredProcesses.find(c => c.id===p.id);
                      const maxW = Math.max(1, ...result.processMetrics.map(x => x.waiting));
                      const h = (p.waiting/maxW)*70;
                      return (
                        <div key={p.id} className="bar-col">
                          <span className="bar-val" style={{color:cp?.color.light,fontSize:9}}>{p.waiting}</span>
                          <div className="bar-fill" style={{height:Math.max(4,h),background:cp?.color.bg,boxShadow:`0 0 10px ${cp?.color.glow}`}}></div>
                          <span className="bar-lbl" style={{color:cp?.color.light}}>{p.name}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>

              {/* Compare */}
              {showCompare && compareResults && (
                <div>
                  <div className="section-header" style={{justifyContent:'space-between'}}>
                    <div style={{display:'flex',alignItems:'center',gap:8}}><div className="section-dot"></div>Algorithm Comparison</div>
                    <button onClick={() => setShowCompare(false)} style={{background:'none',border:'none',color:'var(--text2)',cursor:'pointer',fontSize:11}}>✕ Close</button>
                  </div>
                  <div className="compare-grid">
                    {['FCFS','SJF','RR'].map(a => {
                      const r = compareResults[a];
                      const isSelected = algo === a;
                      return (
                        <div key={a} className="compare-col" style={{borderColor:isSelected?'var(--accent)':'var(--border)'}}>
                          <div className="compare-col-title" style={{color:isSelected?'#a5b4fc':'var(--text)'}}>
                            {a==='RR'?`RR (q=${quantum})`:a}
                            {isSelected && <span style={{fontSize:8,marginLeft:6,color:'var(--neon2)'}}>ACTIVE</span>}
                          </div>
                          <div className="compare-metric"><span className="compare-metric-label">Avg Wait</span><span className="compare-metric-val" style={{color:'var(--neon)'}}>{r.avgWaiting.toFixed(1)}</span></div>
                          <div className="compare-metric"><span className="compare-metric-label">Avg TAT</span><span className="compare-metric-val" style={{color:'var(--neon2)'}}>{r.avgTurnaround.toFixed(1)}</span></div>
                          <div className="compare-metric"><span className="compare-metric-label">CS Count</span><span className="compare-metric-val" style={{color:'var(--gold)'}}>{r.contextSwitches}</span></div>
                          <div className="compare-metric"><span className="compare-metric-label">CPU Util</span><span className="compare-metric-val" style={{color:'#a5b4fc'}}>{r.cpuUtil.toFixed(1)}%</span></div>
                          <div className="compare-metric"><span className="compare-metric-label">CS Cost</span><span className="compare-metric-val" style={{color:'var(--danger)'}}>{r.contextSwitches*csOverheadMs}ms</span></div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </>
          ) : (
            <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:200,color:'var(--text3)',fontSize:12,fontFamily:'JetBrains Mono'}}>
              Add processes and run to see results
            </div>
          )}
        </div>
      </div>

      {/* ── STATUS BAR ── */}
      <div className="status-bar">
        <div className={`status-dot ${simState==='running'?'running':simState==='done'?'done':isContextSwitch?'switching':'idle'}`}></div>
        <span>
          {simState==='running' ? (isContextSwitch ? '⚡ Context Switch in Progress...' : `Executing ${currentProcess?.name||'—'}`)
           : simState==='done' ? 'Simulation Complete'
           : simState==='paused' ? 'Simulation Paused'
           : 'Ready — Configure processes and run simulation'}
        </span>
        {result && (
          <>
            <span style={{marginLeft:'auto'}}>
              Total: <span style={{color:'var(--text)'}}>{result.totalTime}ms</span>
            </span>
            <span>Switches: <span style={{color:'var(--gold)'}}>{result.contextSwitches}</span></span>
            <span>Overhead: <span style={{color:'var(--danger)'}}>{(result.contextSwitches*csOverheadMs).toFixed(1)}ms</span></span>
            <span>Backend: <span style={{color:backendStatus==='connected'?'var(--neon2)':'var(--text3)'}}>
              {backendStatus==='connected'?'API LIVE':'LOCAL'}
            </span></span>
          </>
        )}
      </div>

      {/* Tooltip */}
      {tooltip && (
        <div className="tooltip" style={{left:tooltip.x+12,top:tooltip.y-70}}>
          <div style={{fontWeight:800,color:tooltip.block.color?.light,marginBottom:5,fontSize:13}}>{tooltip.block.name}</div>
          <div style={{color:'var(--text2)',marginBottom:2}}>Start: <span style={{color:'var(--text)'}}>{tooltip.block.start}ms</span></div>
          <div style={{color:'var(--text2)',marginBottom:2}}>End: <span style={{color:'var(--text)'}}>{tooltip.block.end}ms</span></div>
          <div style={{color:'var(--text2)'}}>Duration: <span style={{color:'var(--neon)',fontFamily:'JetBrains Mono',fontWeight:700}}>{(tooltip.block.end-tooltip.block.start).toFixed(1)}ms</span></div>
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>
